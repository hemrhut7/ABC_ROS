%YAML:1.0

# ==============================================================================
# VINS-Fusion Stereo + IMU Configuration
# 適用於 ABC_ROS 機器人平台
# 雙目相機: Waveshare AR0144 (640x480)
# IMU: ESP32 (ICM-20948)
# ==============================================================================

# ======================== Common Parameters ========================
# support: 1 imu 1 cam; 1 imu 2 cam; 2 cam
imu: 1
num_of_cam: 2

imu_topic: "/imu/data_raw"
image0_topic: "/camera/left/image_mono"
image1_topic: "/camera/right/image_mono"
output_path: "./output/"

cam0_calib: "cam0_pinhole.yaml"
cam1_calib: "cam1_pinhole.yaml"
image_width: 640
image_height: 480

# GPU acceleration
use_gpu: 0
use_gpu_acc_flow: 0
use_gpu_ceres: 0

# ======================== Extrinsic Parameters ========================
# Extrinsic parameter between IMU and Camera.
# 0: Have accurate extrinsic parameters (trust body_T_cam values exactly)
# 1: Have an initial guess, system will optimize online
estimate_extrinsic: 0

# Transformation from IMU body frame to Camera frame
# 來源: Kalibr calibration (kalibr_mono_20260906_114026)
# body_T_cam = inv(T_cam_imu)  — T_cam_imu from camchain-imucam.yaml
body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ 0.02367378,  0.00337240,  0.99971405,  0.04427751,
          -0.99971785,  0.00202436,  0.02366704,  0.04159181,
          -0.00194397, -0.99999226,  0.00341938,  0.09237273,
           0.0,         0.0,         0.0,         1.0 ]

body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ 0.01044752, -0.00454501,  0.99993509,  0.04574459,
          -0.99994307,  0.00212074,  0.01045724, -0.01030727,
          -0.00216813, -0.99998742, -0.00452259,  0.09208839,
           0.0,         0.0,         0.0,         1.0 ]

# Multiple thread support
multiple_thread: 4

# ======================== Feature Tracker Parameters ========================
max_cnt: 150            # max feature number in feature tracking
min_dist: 20            # min distance between two features
freq: 10                # frequency (Hz) of publish tracking result. Set 0 for raw frequency.
F_threshold: 1.0        # ransac threshold (pixel)
show_track: 1           # publish tracking image as topic
flow_back: 1            # perform forward-backward optical flow for better robustness
equalize: 1             # enable adaptive histogram equalization

# ======================== Optimization Parameters ========================
max_solver_time: 0.04   # max solver iteration time (second), increase on powerful hardware
max_num_iterations: 8   # max solver iterations
keyframe_parallax: 10.0 # keyframe selection threshold (pixel)

# ======================== IMU Parameters ========================
acc_n: 0.10               # 加速度計噪聲密度 (m/s^2 / sqrt(Hz))
gyr_n: 0.010              # 陀螺儀噪聲密度 (rad/s / sqrt(Hz))
acc_w: 0.0010             # 加速度計零偏隨機遊走 (m/s^3 / sqrt(Hz))
gyr_w: 0.00010            # 陀螺儀零偏隨機遊走 (rad/s^2 / sqrt(Hz))
g_norm: 9.81007           # gravity magnitude

# ======================== Time Offset ========================
# 來源: Kalibr camchain-imucam (kalibr_mono_20260906_114026, timeshift_cam_imu: ~0.00023s)
# 附註: 時間差已小於 0.3 ms，相機與 IMU 硬體時脈嚴格對齊，此處 td 設為 0.0
estimate_td: 0                      # online estimate time offset between camera and imu
td: 0.0                             # initial value of time offset (s)

# ======================== Loop Closure ========================
loop_closure: 1          # 1 to enable loop closure (建議在 Jetson 上先關閉以節省運算)

# ======================== Visualization ========================
save_image: 0            # save image in pose graph for visualization purpose
visualize_imu_forward: 0
visualize_camera_size: 0.4
