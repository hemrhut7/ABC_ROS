image_splitter_node:
  ros__parameters:
    video_device: 0
    auto_detect_device: true
    width: 1280
    height: 480
    fps: 60
    fourcc: "MJPG"
    frame_id: "camera_link"
    rotation_angle: 180
    jpeg_quality: 60

esp32_serial_node:
  ros__parameters: {}

data_logger_node:
  ros__parameters:
    auto_log: true
    mode: "lidar" # Options: esp32, lidar, camera, total
    record_output_dir: "ros2_bag"

ins_ekf_node:
  ros__parameters:
    ekf_mode: 16
    imu_topic: "/imu/data_raw"
    gnss_topic: "/gnss/fix"
    mag_topic: "/imu/mag"
    baro_topic: "/baro/pressure"
    vel_topic: "/velocity"
    joint_states_topic: "/joint_states"
    wheel_radius: 0.0325
    wheel_separation: 0.20
    use_joint_states: true
    enable_gnss_pos: false
    enable_gnss_vel: false
    enable_mag: true
    enable_baro: true
    enable_agv: true
    block_agv_h: false
    std_agv: [0.1, 0.1, 10.0]
    lever_arm_agv: [-0.012, 0.015, -0.0805]
    enable_nhc: false
    enable_zupt_hor: false
    press_params: 10.0
    std_mag: 50.0
    std_mag_yaw: 5.0
    init_cov_p: 5.0
    init_cov_v: 0.5
    init_cov_att: 3.0
    init_cov_yaw: 30.0
    publish_tf: true
    map_frame: "odom"
    base_link_frame: "base_link"

n10_lidar_node:
  ros__parameters:
    port: ""
    baud_rate: 230400
    frame_id: "laser_link"
    topic_name: "/scan"
    range_min: 0.1
    range_max: 12.0


