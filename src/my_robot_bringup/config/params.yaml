image_splitter_node:
  ros__parameters:
    video_device: 0
    width: 1280
    height: 480
    fps: 60
    fourcc: "MJPG"
    frame_id: "camera_link"
    rotation_angle: 180
    jpeg_quality: 60

esp32_serial_node:
  ros__parameters:
    display_rate: 0.2
    auto_record: true
    record_output_dir: "ros2_bag"
    record_topics:
      - "/imu/data_raw"
      - "/imu/mag"
      - "/baro/pressure"
      - "/baro/temperature"
      - "/joint_states"
      - "/battery_state"
      - "/system_mode"
      - "/pid_target"
      - "/gnss/fix"
      - "/tf_static"

ins_ekf_node:
  ros__parameters:
    ekf_mode: 16
    imu_topic: "/imu/data_raw"
    gnss_topic: "/gnss/fix"
    mag_topic: "/imu/mag"
    baro_topic: "/baro/pressure"
    vel_topic: "/velocity"
    joint_states_topic: "/joint_states"
    wheel_radius: 0.0325
    wheel_separation: 0.20
    use_joint_states: true
    enable_gnss_pos: false
    enable_gnss_vel: false
    enable_mag: false
    enable_baro: true
    enable_agv: true
    block_agv_h: false
    std_agv: [0.1, 0.1, 10.0]
    lever_arm_agv: [0.0, 0.0, 0.0]
    enable_nhc: false
    enable_zupt_hor: false
    press_params: 10.0
    init_cov_p: 5.0
    init_cov_v: 0.5
    init_cov_att: 3.0
    init_cov_yaw: 30.0
    publish_tf: true
    map_frame: "odom"
    base_link_frame: "base_link"

n10_lidar_node:
  ros__parameters:
    port: ""
    baud_rate: 230400
    frame_id: "laser_frame"
    topic_name: "/scan"
    range_min: 0.1
    range_max: 12.0


